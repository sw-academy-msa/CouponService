# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# 쿠폰 원본, 발급 경합, 주문 잠금과 Kafka 결과 반영의 책임과 검증 범위를 구분합니다.
language: ko-KR
tone_instructions: "실제 버그·권한·데이터 일관성을 한국어로 설명하세요. 미확정 정책을 임의로 추가하지 마세요."
reviews:
  profile: chill
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches: ["^main$", "^develop$"]
  path_filters:
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!gradle/wrapper/*.jar"
  path_instructions:
    - path: "src/main/java/**"
      instructions: |
        Coupon은 자신의 쿠폰 DB만 관리하고 주문 금액 계산, Order Saga, Product 재고 책임을 가져오지 않습니다.
        개인키·토큰 발급은 Account 책임입니다. 사용자 헤더나 본문의 accountId를 사용자 인증 근거로 신뢰하지 마세요.
        선착순과 예산은 조건부 UPDATE와 유니크로 지키고, 동의 확인과 주문 조회 HTTP는 DB 트랜잭션 밖에서 수행합니다.
        결과를 모르는 잠금은 해제하지 않습니다. 중복·순서 역전·임대 만료·타임아웃을 검토하세요.
        한국어 주석·4칸 들여쓰기·service/impl·dto/request·dto/response·책임별 global/config를 유지하세요.
    - path: "src/main/resources/**"
      instructions: |
        Flyway가 테이블을 만들고 운영은 validate를 유지하세요. 업무 플래그 기본값은 false입니다.
        비밀값·개인정보·실제 토큰을 코드나 로그에 넣지 마세요.
chat:
  auto_reply: true
